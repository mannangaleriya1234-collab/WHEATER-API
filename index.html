<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Weather</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<main class="app">
  <form class="search" id="searchForm">
    <input id="cityInput" type="text" placeholder="Search a city, e.g. Surat" aria-label="City name" required>
    <button type="submit">Search</button>
  </form>

  <div class="tools">
    <button class="link" id="locBtn" type="button">Use my location</button>
    <button class="link" id="unitBtn" type="button">Switch to °F</button>
  </div>

  <p id="message" role="status"></p>

  <section id="weather" class="hidden">
    <div class="now">
      <div class="city" id="cityName"></div>
      <div class="icon" id="icon"></div>
      <div class="temp" id="temp"></div>
      <div class="desc" id="desc"></div>
    </div>

    <div class="details">
      <div class="box"><small>Feels like</small><strong id="feels"></strong></div>
      <div class="box"><small>Humidity</small><strong id="humidity"></strong></div>
      <div class="box"><small>Wind</small><strong id="wind"></strong></div>
    </div>

    <div class="forecast" id="forecast"></div>
  </section>
</main>

<script src="script.js"></script>
</body>
</html>
